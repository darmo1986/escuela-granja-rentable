name: Publicar artículos

# Solo un cambio en blog/posts/ dispara esto. El commit de la propia Action
# no toca esa carpeta, y además GITHUB_TOKEN no vuelve a lanzar workflows.
on:
  push:
    branches:
      - main
    paths:
      - "blog/posts/**"

permissions:
  contents: write

concurrency:
  group: publicar-articulos
  cancel-in-progress: false

jobs:
  generar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v4

      - name: Generar el HTML
        run: python3 blog/generar.py

      - name: Guardar en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada nuevo que publicar."
            exit 0
          fi
          git commit -m "Publica los artículos generados."
          git push
